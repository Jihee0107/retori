<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매트 계산기</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        .brand-switch {
            display: none;
        }

        .brand-tab {
            flex: 1;
            height: 100%;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            opacity: 0.48;
            transition: opacity 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
        }

        .brand-tab:hover {
            opacity: 0.75;
        }

        .brand-tab.active {
            opacity: 1;
            transform: translateY(-1px);
            box-shadow: inset 0 -4px 0 rgba(255, 255, 255, 0.95),
                        0 2px 7px rgba(0, 0, 0, 0.12);
        }

        #green-tab {
            background: #81C784;
        }

        #pink-tab {
            background: #FECCBE;
        }

        .app-content {
            flex: 1;
            width: 100%;
            min-height: 0;
            position: relative;
        }

        .app-frame {
            display: none;
            width: 100%;
            height: 100%;
            border: 0;
            background: #ffffff;
        }

        .app-frame.active {
            display: block;
        }

        .brand-fab {
            position: fixed;
            right: 18px;
            bottom: 22px;
            z-index: 9999;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .brand-fab:active {
            transform: scale(0.93);
        }

        @media (max-width: 600px) {
            .brand-switch {
                height: 56px;
                min-height: 56px;
                padding: 6px 8px;
                gap: 6px;
            }

            .brand-tab {
                border-radius: 8px;
            }

            .brand-fab {
                width: 54px;
                height: 54px;
                right: 14px;
                bottom: 18px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <button id="brand-fab" class="brand-fab" type="button" onclick="toggleBrandFab()" aria-label="브랜드 전환"></button>

    <div class="brand-switch" role="tablist" aria-label="계산기 전환">
        <button
            id="green-tab"
            class="brand-tab active"
            type="button"
            role="tab"
            aria-label="초록 계산기"
            aria-selected="true"
            onclick="switchBrand('green')">
        </button>

        <button
            id="pink-tab"
            class="brand-tab"
            type="button"
            role="tab"
            aria-label="분홍 계산기"
            aria-selected="false"
            onclick="switchBrand('pink')">
        </button>
    </div>

        // html2canvas가 CDN 문제로 로드되지 않았을 수 있으니, 저장/복사 시점에
        // 한 번 더 확인하고 필요하면 다른 CDN으로 재시도합니다.
        function ensureHtml2Canvas() {
            if (typeof html2canvas !== 'undefined') return Promise.resolve();
            const urls = [
                'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
                'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
                'https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js'
            ];
            const tryLoad = (i) =&gt; new Promise((resolve, reject) =&gt; {
                if (i &gt;= urls.length) {
                    reject(new Error('html2canvas 로드 실패'));
                    return;
                }
                const script = document.createElement('script');
                script.src = urls[i];
                script.onload = () =&gt; resolve();
                script.onerror = () =&gt; resolve(tryLoad(i + 1));
                document.head.appendChild(script);
            });
            return tryLoad(0);
        }

        function saveQuoteAsImage(btn) {
            const node = document.getElementById('quote-sheet');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = '준비 중...';
            ensureHtml2Canvas().then(() =&gt; {
            btn.innerText = '생성 중...';
            const prevTransform = node.style.transform;
            node.style.transform = 'none';
            html2canvas(node, { scale: 2, backgroundColor: '#ffffff' }).then(canvas =&gt; {
                node.style.transform = prevTransform;
                canvas.toBlob(blob =&gt; {
                    if (!blob) {
                        alert('이미지 생성에 실패했습니다.');
                        btn.disabled = false;
                        btn.innerText = originalText;
                        return;
                    }
                    const today = new Date();
                    const dateStr = today.getFullYear() + '' + String(today.getMonth() + 1).padStart(2, '0') + '' + String(today.getDate()).padStart(2, '0');
                    const fileName = '토리매트_견적서_' + dateStr + '.png';

                    const downloadBlob = () =&gt; {
                        // 삼성 인터넷 등 일부 브라우저는 다운로드 전 &quot;데이터 사용 확인&quot; 창을 띄우는데,
                        // 그 사이 Blob URL을 미리 해제해버리면 다운로드가 조용히 실패합니다.
                        // 그래서 만료되지 않는 data URL 방식을 사용합니다.
                        const reader = new FileReader();
                        reader.onload = () =&gt; {
                            try {
                                const link = document.createElement('a');
                                link.download = fileName;
                                link.href = reader.result;
                                document.body.appendChild(link);
                                link.click();
                                document.body.removeChild(link);
                            } catch (e) {
                                // 다운로드 자체가 막힌 경우: 새 탭에 이미지를 열어 길게 눌러 저장하도록 안내
                                const win = window.open();
                                if (win) {
                                    win.document.write('&lt;img src=&quot;' + reader.result + '&quot; style=&quot;max-width:100%;&quot;&gt;');
                                } else {
                                    alert('이미지 저장에 실패했습니다. 팝업 차단을 해제한 뒤 다시 시도해주세요.');
                                }
                            }
                            btn.disabled = false;
                            btn.innerText = originalText;
                        };
                        reader.onerror = () =&gt; {
                            alert('이미지 저장에 실패했습니다.');
                            btn.disabled = false;
                            btn.innerText = originalText;
                        };
                        reader.readAsDataURL(blob);
                    };

                    let file = null;
                    let canUseShare = false;
                    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                        (navigator.platform === 'MacIntel' &amp;&amp; navigator.maxTouchPoints &gt; 1);
                    try {
                        file = new File([blob], fileName, { type: 'image/png' });
                        // 아이폰은 공유시트에 &quot;이미지 저장&quot; 항목이 있어 바로 갤러리 저장 가능하지만,
                        // 안드로이드 공유시트는 그런 항목이 없어 다운로드가 더 확실함
                        canUseShare = isIOS &amp;&amp; !!(navigator.share &amp;&amp; navigator.canShare &amp;&amp; navigator.canShare({ files: [file] }));
                    } catch (e) {
                        canUseShare = false;
                    }

                    // 아이폰: 공유시트를 열어 &quot;이미지 저장(사진 앱에 저장)&quot;으로 바로 갤러리 저장 가능
                    if (canUseShare) {
                        try {
                            navigator.share({ files: [file], title: '토리매트 견적서' }).then(() =&gt; {
                                btn.disabled = false;
                                btn.innerText = originalText;
                            }).catch((err) =&gt; {
                                // 사용자가 공유창을 취소한 경우가 아니면 다운로드로 대체 시도
                                if (err &amp;&amp; err.name === 'AbortError') {
                                    btn.disabled = false;
                                    btn.innerText = originalText;
                                    return;
                                }
                                downloadBlob();
                            });
                        } catch (e) {
                            downloadBlob();
                        }
                        return;
                    }

                    // PC/공유시트 미지원 브라우저: 다운로드
                    downloadBlob();
                }, 'image/png');
            }).catch(() =&gt; {
                node.style.transform = prevTransform;
                alert('이미지 생성 중 오류가 발생했습니다.');
                btn.disabled = false;
                btn.innerText = originalText;
            });
            }).catch(() =&gt; {
                alert('이미지 기능을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해서 다시 시도해주세요.');

                btn.innerText = originalText;
            });

            // 이미지(Promise)는 나중에 완성되는 대로 채워주는 방식으로 처리합니다.
            const prevTransform = node.style.transform;

                    }, 'image/png');
                })).catch(err =&gt; {
                    node.style.transform = prevTransform;
                    throw err;
                });

            try {
                navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': blobPromise })
                ]).then(() =&gt; {
                    btn.disabled = false;
                    btn.innerText = originalText;
                    alert('견적서 이미지가 클립보드에 복사되었습니다.');

                    btn.disabled = false;

        function scaleQuoteSheet() {

    &lt;div class=&quot;container&quot;&gt;
        &lt;div class=&quot;tabs&quot;&gt;
            &lt;button class=&quot;tab-button&quot; id=&quot;calc-tab&quot; onclick=&quot;showTab('calculator')&quot;&gt;계산기&lt;/button&gt;
            &lt;button class=&quot;tab-button&quot; id=&quot;form-tab&quot; onclick=&quot;showTab('estimate')&quot;&gt;양식&lt;/button&gt;
            &lt;button class=&quot;tab-button&quot; id=&quot;message-tab&quot; onclick=&quot;showTab('message')&quot;&gt;카톡/톡톡/문자&lt;/button&gt;
        &lt;/div&gt;
        &lt;div id=&quot;calculator&quot; class=&quot;tab-content&quot;&gt;
            &lt;h1&gt;우아매트 계산기&lt;/h1&gt;
            &lt;div class=&quot;input-group&quot;&gt;
                &lt;label&gt;&lt;b&gt;거실&lt;/b&gt;&lt;/label&gt;
                &lt;input type=&quot;number&quot; id=&quot;거실_가로&quot; placeholder=&quot;가로(cm)&quot; value=&quot;0&quot; onfocus=&quot;this.value=''&quot;&gt;
                &lt;input type=&quot;number&quot; id=&quot;거실_세로&quot; placeholder=&quot;세로(cm)&quot; value=&quot;0&quot; onfocus=&quot;this.value=''&quot;&gt;
            &lt;/div&gt;
            &lt;div class=&quot;input-group&quot;&gt;
                &lt;label&gt;&lt;b&gt;복도&lt;/b&gt;&lt;/label&gt;
                &lt;input type=&quot;number&quot; id=&quot;복도_가로&quot; placeholder=&quot;가로(cm)&quot; value=&quot;0&quot; onfocus=&quot;this.value=''&quot;&gt;
                &lt;input type=&quot;number&quot; id=&quot;복도_세로&quot; placeholder=&quot;세로(cm)&quot; value=&quot;0&quot; onfocus=&quot;this.value=''&quot;&gt;
            &lt;/div&gt;
            &lt;div class=&quot;input-group&quot;&gt;
                &lt;label&gt;&lt;b&gt;주방&lt;/b&gt;&lt;/label&gt;
                &lt;input type=&quot;number&quot; id=&quot;주방_가로&quot; placeholder=&quot;가로(cm)&quot; value=&quot;0&quot; onfocus=&quot;this.value=''&quot;&gt;
                &lt;input type=&quot;number&quot; id=&quot;주방_세로&quot; placeholder=&quot;세로(cm)&quot; value=&quot;0&quot; onfocus=&quot;this.value=''&quot;&gt;
            &lt;/div&gt;
            &lt;div class=&quot;input-group&quot;&gt;
                &lt;label&gt;&lt;b&gt;작은 방&lt;/b&gt;&lt;/label&gt;
                &lt;input type=&quot;number&quot; id=&quot;작은방_가로&quot; placeholder=&quot;가로(cm)&quot; value=&quot;0&quot; onfocus=&quot;this.value=''&quot;&gt;
                &lt;input type=&quot;number&quot; id=&quot;작은방_세로&quot; placeholder=&quot;세로(cm)&quot; value=&quot;0&quot; onfocus=&quot;this.value=''&quot;&gt;
            &lt;/div&gt;
            &lt;div class=&quot;input-group&quot;&gt;
                &lt;label&gt;&lt;b&gt;큰 방&lt;/b&gt;&lt;/label&gt;
                &lt;input type=&quot;number&quot; id=&quot;큰방_가로&quot; placeholder=&quot;가로(cm)&quot; value=&quot;0&quot; onfocus=&quot;this.value=''&quot;&gt;
                &lt;input type=&quot;number&quot; id=&quot;큰방_세로&quot; placeholder=&quot;세로(cm)&quot; value=&quot;0&quot; onfocus=&quot;this.value=''&quot;&gt;
            &lt;/div&gt;
            &lt;div class=&quot;input-group&quot;&gt;
                &lt;label&gt;&lt;b&gt;발코니&lt;/b&gt;&lt;/label&gt;
                &lt;input type=&quot;number&quot; id=&quot;발코니_가로&quot; placeholder=&quot;가로(cm)&quot; value=&quot;0&quot; onfocus=&quot;this.value=''&quot;&gt;
                &lt;input type=&quot;number&quot; id=&quot;발코니_세로&quot; placeholder=&quot;세로(cm)&quot; value=&quot;0&quot; onfocus=&quot;this.value=''&quot;&gt;
            &lt;/div&gt;
            &lt;div class=&quot;input-group&quot;&gt;
                &lt;label&gt;&lt;b&gt;기타&lt;/b&gt;&lt;/label&gt;
                &lt;input type=&quot;number&quot; id=&quot;기타_가로&quot; placeholder=&quot;가로(cm)&quot; value=&quot;0&quot; onfocus=&quot;this.value=''&quot;&gt;
                &lt;input type=&quot;number&quot; id=&quot;기타_세로&quot; placeholder=&quot;세로(cm)&quot; value=&quot;0&quot; onfocus=&quot;this.value=''&quot;&gt;
            &lt;/div&gt;
            &lt;div class=&quot;buttons&quot;&gt;
                &lt;button class=&quot;calculate&quot; onclick=&quot;calculate()&quot;&gt;계산하기&lt;/button&gt;
                &lt;button class=&quot;reset&quot; onclick=&quot;resetValues()&quot;&gt;초기화&lt;/button&gt;
            &lt;/div&gt;
            &lt;div id=&quot;result&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div id=&quot;estimate&quot; class=&quot;tab-content hidden&quot;&gt;
            &lt;h1&gt;견적 양식&lt;/h1&gt;
            &lt;div class=&quot;quick-buttons&quot;&gt;
                &lt;button class=&quot;quick-button&quot; onclick=&quot;toggleQuickButtons('25평/59㎡')&quot;&gt;25평/59㎡&lt;/button&gt;
                &lt;button class=&quot;quick-button&quot; onclick=&quot;toggleQuickButtons('30평/74㎡')&quot;&gt;30평/74㎡&lt;/button&gt;
                &lt;button class=&quot;quick-button&quot; onclick=&quot;toggleQuickButtons('34평/84㎡')&quot;&gt;34평/84㎡&lt;/button&gt;
                &lt;button class=&quot;quick-button&quot; onclick=&quot;toggleQuickButtons('30평후')&quot;&gt;30평후&lt;/button&gt;
                &lt;button class=&quot;quick-button&quot; onclick=&quot;toggleQuickButtons('40평초')&quot;&gt;40평초&lt;/button&gt;
                &lt;button class=&quot;quick-button&quot; onclick=&quot;toggleQuickButtons('40평중후')&quot;&gt;40평중후&lt;/button&gt;
            &lt;/div&gt;
            &lt;div id=&quot;quick-options&quot; class=&quot;quick-buttons hidden&quot;&gt;&lt;/div&gt;

            &lt;div class=&quot;input-group&quot;&gt;
                &lt;label&gt;&lt;b&gt;80매트&lt;/b&gt;&lt;/label&gt;
                &lt;input type=&quot;number&quot; id=&quot;mat80&quot; placeholder=&quot;수량 입력&quot; value=&quot;0&quot; oninput=&quot;syncMat80()&quot;&gt;
            &lt;/div&gt;
            &lt;div class=&quot;input-group&quot;&gt;
                &lt;label&gt;&lt;b&gt;120매트&lt;/b&gt;&lt;/label&gt;
                &lt;input type=&quot;number&quot; id=&quot;mat120&quot; placeholder=&quot;수량 입력&quot; value=&quot;0&quot; oninput=&quot;syncMat100()&quot;&gt;
            &lt;/div&gt;
            &lt;div class=&quot;buttons&quot;&gt;
                &lt;button class=&quot;calculate&quot; onclick=&quot;calculateEstimate()&quot;&gt;견적 계산하기&lt;/button&gt;
                &lt;button class=&quot;reset&quot; onclick=&quot;resetEstimateValues()&quot;&gt;초기화&lt;/button&gt;
            &lt;/div&gt;
            &lt;div id=&quot;price-result&quot;&gt;&lt;/div&gt;

        function toggleQuickButtons(type) {
    const buttons = document.querySelectorAll('.quick-button');
    buttons.forEach(button =&gt; button.classList.remove('active'));

    const selectedButton = Array.from(buttons).find(button =&gt; button.innerText === type);

        // 한 번 더 확인하고 필요하면 다른 CDN으로 재시도합니다.
        function ensureHtml2Canvas() {
            if (typeof html2canvas !== 'undefined') return Promise.resolve();
            const urls = [
                'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
                'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
                'https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js'
            ];
            const tryLoad = (i) =&gt; new Promise((resolve, reject) =&gt; {
                if (i &gt;= urls.length) {
                    reject(new Error('html2canvas 로드 실패'));
                    return;
                }
                const script = document.createElement('script');
                script.src = urls[i];
                script.onload = () =&gt; resolve();
                script.onerror = () =&gt; resolve(tryLoad(i + 1));
                document.head.appendChild(script);
            });
            return tryLoad(0);
        }

        function saveQuoteAsImage(btn) {
            const node = document.getElementById('quote-sheet');

            ensureHtml2Canvas().then(() =&gt; {
            btn.innerText = '생성 중...';
            const prevTransform = node.style.transform;
            node.style.transform = 'none';
            html2canvas(node, { scale: 2, backgroundColor: '#ffffff' }).then(canvas =&gt; {
                node.style.transform = prevTransform;
                canvas.toBlob(blob =&gt; {
                    if (!blob) {
                        alert('이미지 생성에 실패했습니다.');
                        btn.disabled = false;
                        btn.innerText = originalText;

                    }
                    const today = new Date();
                    const dateStr = today.getFullYear() + '' + String(today.getMonth() + 1).padStart(2, '0') + '' + String(today.getDate()).padStart(2, '0');
                    const fileName = '우아매트_견적서_' + dateStr + '.png';

                    const downloadBlob = () =&gt; {
                        // 삼성 인터넷 등 일부 브라우저는 다운로드 전 &quot;데이터 사용 확인&quot; 창을 띄우는데,
                        // 그 사이 Blob URL을 미리 해제해버리면 다운로드가 조용히 실패합니다.
                        // 그래서 만료되지 않는 data URL 방식을 사용합니다.
                        const reader = new FileReader();
                        reader.onload = () =&gt; {
                            try {
                                const link = document.createElement('a');
                                link.download = fileName;
                                link.href = reader.result;
                                document.body.appendChild(link);
                                link.click();
                                document.body.removeChild(link);
                            } catch (e) {
                                // 다운로드 자체가 막힌 경우: 새 탭에 이미지를 열어 길게 눌러 저장하도록 안내
                                const win = window.open();
                                if (win) {
                                    win.document.write('&lt;img src=&quot;' + reader.result + '&quot; style=&quot;max-width:100%;&quot;&gt;');
                                } else {
                                    alert('이미지 저장에 실패했습니다. 팝업 차단을 해제한 뒤 다시 시도해주세요.');
                                }
                            }
                            btn.disabled = false;
                            btn.innerText = originalText;
                        };
                        reader.onerror = () =&gt; {
                            alert('이미지 저장에 실패했습니다.');
                            btn.disabled = false;
                            btn.innerText = originalText;
                        };
                        reader.readAsDataURL(blob);
                    };

                    let file = null;
                    let canUseShare = false;
                    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                        (navigator.platform === 'MacIntel' &amp;&amp; navigator.maxTouchPoints &gt; 1);
                    try {
                        file = new File([blob], fileName, { type: 'image/png' });
                        // 아이폰은 공유시트에 &quot;이미지 저장&quot; 항목이 있어 바로 갤러리 저장 가능하지만,
                        // 안드로이드 공유시트는 그런 항목이 없어 다운로드가 더 확실함
                        canUseShare = isIOS &amp;&amp; !!(navigator.share &amp;&amp; navigator.canShare &amp;&amp; navigator.canShare({ files: [file] }));
                    } catch (e) {
                        canUseShare = false;
                    }

                    // 아이폰: 공유시트를 열어 &quot;이미지 저장(사진 앱에 저장)&quot;으로 바로 갤러리 저장 가능

    <script>
        function switchBrand(brand) {
            const isGreen = brand === 'green';

            document.getElementById('green-tab').classList.toggle('active', isGreen);
            document.getElementById('pink-tab').classList.toggle('active', !isGreen);

            document.getElementById('green-tab').setAttribute('aria-selected', isGreen ? 'true' : 'false');
            document.getElementById('pink-tab').setAttribute('aria-selected', !isGreen ? 'true' : 'false');

            document.getElementById('green-app').classList.toggle('active', isGreen);
            document.getElementById('pink-app').classList.toggle('active', !isGreen);

            updateBrandFab(isGreen);
        }

        function updateBrandFab(isGreenActive) {
            const fab = document.getElementById('brand-fab');
            if (isGreenActive) {
                fab.style.backgroundColor = '#FECCBE';
                fab.setAttribute('aria-label', '우아매트로 전환');
            } else {
                fab.style.backgroundColor = '#81C784';
                fab.setAttribute('aria-label', '토리매트로 전환');
            }
        }

        function toggleBrandFab() {
            const isGreenActive = document.getElementById('green-tab').classList.contains('active');
            switchBrand(isGreenActive ? 'pink' : 'green');
        }

        updateBrandFab(true);
